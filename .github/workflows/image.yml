# Builds the image for linux/amd64 on GitHub's own runners
# and pushes it to ghcr.io/kaperkunde/voyage-nano-embeddings: on every push to
# main as `main`, `latest` (the tag a PCP service definition's `source`
# follows) and `sha-<commit>`, and on a version tag (v1.2.3) as `1.2.3`.
#
# As PCP's own build-images.yml does: the digest (the manifest list's) is
# signed with cosign, keyless (a Sigstore certificate for this workflow's
# GitHub OIDC token, naming this file and the ref it ran from; the
# signature is in Sigstore's public log), --recursive so each platform's
# manifest is signed too (today one: the hashed requirements.txt is for
# amd64); GitHub's build provenance is attested for the
# same digest and pushed beside it. The build keeps `provenance: false`, so
# the image stays a plain manifest list. The last step checks the
# signature the way someone pulling it would:
#
#   cosign verify ghcr.io/kaperkunde/voyage-nano-embeddings@sha256:<digest> \
#     --certificate-identity-regexp '^https://github\.com/kaperkunde/voyage-nano-embeddings/\.github/workflows/image\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/kaperkunde/voyage-nano-embeddings@sha256:<digest> --repo kaperkunde/voyage-nano-embeddings
#
# The digest is printed in the run's summary: that is what a PCP service
# definition pins. Every action is pinned by commit.

name: image

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kaperkunde/voyage-nano-embeddings

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: build, push, sign, attest
    needs: checks
    # Only main and version tags publish: a dispatch from another branch
    # runs the checks and pushes nothing.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # id-token: the OIDC token cosign and the attestation are signed with.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-$SHA"
            if [ "$REF_TYPE" = tag ]; then
              case "$REF_NAME" in
                v[0-9]*.[0-9]*.[0-9]*) ;;
                *) echo "::error::Not a version tag: $REF_NAME"; exit 1 ;;
              esac
              echo "$IMAGE:${REF_NAME#v}"
            else
              echo "$IMAGE:main"
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # A plain manifest list: provenance is attested below instead.
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Not an image digest: $ref"
            exit 1
          fi
          cosign sign --yes --recursive "$ref"
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Check the signature as a puller would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github\.com/kaperkunde/voyage-nano-embeddings/\.github/workflows/image\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
