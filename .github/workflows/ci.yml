# Checks on every pull request, and before every image build on main
# (image.yml calls this workflow): lint, formatting, the tests (a fake
# encoder; nothing here downloads the model), and the container image built,
# started with the real model and put through scripts/smoke.py, without
# pushing. Every action is pinned by commit.

name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q

  image:
    name: container image (not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: voyage-nano-embeddings:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Start it, check its user and run the smoke test against the real model
        env:
          API_KEY: ci-key-0123456789abcdef0123456789abcdef
        run: |
          docker run -d --name voyage-nano -p 127.0.0.1:8000:8000 \
            --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp \
            -e API_KEY voyage-nano-embeddings:ci
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          test "$(docker exec voyage-nano id -u)" = 10001
          test "$(docker inspect --format '{{.State.Health.Status}}' voyage-nano)" != unhealthy
          python3 scripts/smoke.py http://127.0.0.1:8000
          docker logs voyage-nano
          docker rm -f voyage-nano
      - name: The container refuses to start without a key
        run: |
          if docker run --rm voyage-nano-embeddings:ci; then
            echo "::error::It started without API_KEY"; exit 1
          fi
