[project]
name = "voyage-nano-embeddings"
version = "1.0.0"
description = "voyage-4-nano text embeddings on CPU behind an OpenAI-compatible API"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
